services:
  - type: web
    name: agriflow-africa
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run db:deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agriflow-africa-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true

databases:
  - name: agriflow-africa-db
    databaseName: agriflow_africa
    user: agriflow_africa
    plan: free
    region: frankfurt
